version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      factory-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
    open-pull-requests-limit: 1
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      factory-actions:
        applies-to: version-updates
        patterns:
          - "*"
    open-pull-requests-limit: 1
