version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    cooldown:
      default-days: 7
    groups:
      factory-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
    open-pull-requests-limit: 1
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    cooldown:
      default-days: 7
    groups:
      factory-actions:
        applies-to: version-updates
        patterns:
          - "*"
    open-pull-requests-limit: 1
