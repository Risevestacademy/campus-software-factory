name: Factory / Ruleset drift audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: vars.FACTORY_AUDIT_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Collect actual factory rulesets
        env:
          FACTORY_AUDIT_TOKEN: ${{ secrets.FACTORY_AUDIT_TOKEN }}
        run: pnpm --silent drift:collect > "$RUNNER_TEMP/actual-rulesets.json"
      - name: Compare expected and actual rulesets
        id: drift
        env:
          ACTUAL_RULESETS: ${{ runner.temp }}/actual-rulesets.json
          DRIFT_REPORT: ${{ runner.temp }}/drift-report.json
        run: |
          set +e
          pnpm --silent drift:check policies/rulesets/expected.json "$ACTUAL_RULESETS" > "$DRIFT_REPORT"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "detected=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Audit the factory review gate
        id: review_gate
        env:
          FACTORY_AUDIT_TOKEN: ${{ secrets.FACTORY_AUDIT_TOKEN }}
          GATE_REPORT: ${{ runner.temp }}/review-gate-report.json
        run: |
          set +e
          pnpm --silent drift:review-gate > "$GATE_REPORT"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "detected=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open a drift issue
        if: steps.drift.outputs.detected == 'true' || steps.review_gate.outputs.detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT_REPORT: ${{ runner.temp }}/drift-report.json
          GATE_REPORT: ${{ runner.temp }}/review-gate-report.json
          ISSUE_BODY: ${{ runner.temp }}/drift-issue.md
        run: |
          {
            echo "## Ruleset drift"
            echo '```json'
            cat "$DRIFT_REPORT"
            echo '```'
            echo "## Review gate drift"
            echo '```json'
            cat "$GATE_REPORT"
            echo '```'
          } > "$ISSUE_BODY"
          existing="$(gh issue list --state open --search 'Factory ruleset drift in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$ISSUE_BODY"
          else
            gh issue create --title "Factory ruleset drift" --body-file "$ISSUE_BODY"
          fi
      - name: Fail when drift exists
        if: steps.drift.outputs.detected == 'true' || steps.review_gate.outputs.detected == 'true'
        run: exit 1
