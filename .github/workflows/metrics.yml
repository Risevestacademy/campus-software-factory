name: Factory / Weekly scorecard

on:
  workflow_dispatch:
    inputs:
      metrics-input:
        description: Normalized MetricsInput JSON produced by audited product adapters.
        required: true
        type: string
  repository_dispatch:
    types: [factory-metrics]

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Normalize event payload
        env:
          DISPATCH_INPUT: ${{ github.event.client_payload.metrics-input }}
          MANUAL_INPUT: ${{ inputs.metrics-input }}
          METRICS_INPUT_FILE: ${{ runner.temp }}/metrics-input.json
        run: |
          if [ -n "$MANUAL_INPUT" ]; then
            printf '%s' "$MANUAL_INPUT" > "$METRICS_INPUT_FILE"
          elif [ -n "$DISPATCH_INPUT" ]; then
            printf '%s' "$DISPATCH_INPUT" > "$METRICS_INPUT_FILE"
          else
            echo "No normalized metrics payload was provided" >&2
            exit 1
          fi
      - name: Build aggregate scorecard
        env:
          METRICS_INPUT_FILE: ${{ runner.temp }}/metrics-input.json
          METRICS_REPORT_FILE: ${{ runner.temp }}/metrics-report.json
        run: pnpm metrics:report "$METRICS_INPUT_FILE" > "$METRICS_REPORT_FILE"
      - name: Publish scorecard issue
        env:
          GH_TOKEN: ${{ github.token }}
          METRICS_REPORT_FILE: ${{ runner.temp }}/metrics-report.json
        run: |
          report_date="$(date -u +%Y-%m-%d)"
          gh issue create --title "Factory scorecard $report_date" --body-file "$METRICS_REPORT_FILE"
      - name: Retain normalized events and aggregate for 90 days
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: factory-scorecard-${{ github.run_id }}
          retention-days: 90
          path: |
            ${{ runner.temp }}/metrics-input.json
            ${{ runner.temp }}/metrics-report.json
