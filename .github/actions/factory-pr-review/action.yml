name: Factory PR Review
description: Provider-neutral, merge-blocking pull request review after successful CI.

inputs:
  repository:
    description: Repository containing the pull request.
    required: true
  workflow-run-id:
    description: GitHub Actions run ID of the completed product CI workflow.
    required: true
  github-token:
    description: Token with actions, contents, and pull-requests read plus checks write.
    required: true
  claude-code-oauth-token:
    description: Claude credential; required when policy selects Claude as primary.
    required: false
  openai-api-key:
    description: OpenAI credential; required when policy selects Codex or Codex fallback.
    required: false

outputs:
  eligible:
    description: Whether this run reviewed the pull request head.
    value: ${{ steps.preflight.outputs.eligible }}
  outcome:
    description: Published review outcome.
    value: ${{ steps.publish.outputs.outcome }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22.22.1"

    - name: Install pinned factory dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts

    - name: Check review eligibility
      id: preflight
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        REPOSITORY: ${{ inputs.repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        WORKFLOW_RUN_ID: ${{ inputs.workflow-run-id }}
      run: pnpm exec tsx src/review/action-runner.ts preflight

    - name: Check out the reviewed head as evidence
      id: checkout_pr
      if: steps.preflight.outputs.eligible == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ steps.preflight.outputs.head_sha }}
        path: pr
        fetch-depth: 0
        persist-credentials: false
        token: ${{ inputs.github-token }}

    - name: Check out trusted guidance from the target branch
      id: checkout_trusted
      if: steps.preflight.outputs.eligible == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ steps.preflight.outputs.base_sha }}
        path: trusted
        sparse-checkout: |
          AGENTS.md
          CLAUDE.md
          docs/
        sparse-checkout-cone-mode: false
        persist-credentials: false
        token: ${{ inputs.github-token }}

    - name: Check out review and TDD skills
      if: steps.preflight.outputs.eligible == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: mattpocock/skills
        ref: 49dd158d1076134a641b33efb035946536778336
        path: .factory-skills/mattpocock
        sparse-checkout: |
          skills/engineering/code-review
          skills/engineering/tdd
        persist-credentials: false

    - name: Check out Vitest skill
      if: steps.preflight.outputs.eligible == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: antfu/skills
        ref: feb0f3aba6566426f12230e7fc7a10d97c1293bb
        path: .factory-skills/antfu
        sparse-checkout: skills/vitest
        persist-credentials: false

    - name: Install pinned review skills for both providers
      if: steps.preflight.outputs.eligible == 'true'
      shell: bash
      run: |
        for home in "$RUNNER_TEMP/factory-claude-config" "$RUNNER_TEMP/factory-codex-home"; do
          mkdir -p "$home/skills"
          cp -R .factory-skills/mattpocock/skills/engineering/code-review "$home/skills/code-review"
          cp -R .factory-skills/mattpocock/skills/engineering/tdd "$home/skills/tdd"
          cp -R .factory-skills/antfu/skills/vitest "$home/skills/vitest"
        done

    - name: Install bubblewrap for Claude subprocess isolation
      id: bubblewrap
      if: steps.preflight.outputs.eligible == 'true' && steps.preflight.outputs.provider == 'claude'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/install-bubblewrap.sh"

    - name: Review with Claude (attempt 1)
      id: claude_1
      if: steps.preflight.outputs.eligible == 'true' && steps.preflight.outputs.provider == 'claude'
      continue-on-error: true
      uses: anthropics/claude-code-action@e4a6faad497d33dbc7144135c75e41f82f0bf6c0 # v1.0.255
      env:
        CLAUDE_CONFIG_DIR: ${{ runner.temp }}/factory-claude-config
        CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
      with:
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        # Omitting this does not narrow access: the action falls back to github.token
        # (the same job token) or an OIDC app exchange this job cannot perform.
        github_token: ${{ inputs.github-token }}
        display_report: "false"
        include_fix_links: "false"
        show_full_output: "false"
        prompt: ${{ steps.preflight.outputs.prompt }}
        claude_args: >-
          --model ${{ steps.preflight.outputs.model }}
          --max-turns ${{ steps.preflight.outputs.max_turns }}
          --allowedTools "Read" "Glob" "Grep" "Skill" "Bash(git -C pr diff:*)" "Bash(git -C pr show:*)" "Bash(git -C pr log:*)"
          --disallowedTools "Edit" "Write" "NotebookEdit" "WebFetch" "WebSearch"
          --json-schema '${{ steps.preflight.outputs.output_schema }}'

    - name: Review with Codex (attempt 1)
      id: codex_1
      if: steps.preflight.outputs.eligible == 'true' && steps.preflight.outputs.provider == 'codex'
      continue-on-error: true
      uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
      with:
        openai-api-key: ${{ inputs.openai-api-key }}
        prompt: ${{ steps.preflight.outputs.prompt }}
        output-file: ${{ runner.temp }}/factory-codex-output-1.txt
        output-schema-file: ${{ steps.preflight.outputs.output_schema_path }}
        model: ${{ steps.preflight.outputs.model }}
        effort: ${{ steps.preflight.outputs.effort }}
        codex-home: ${{ runner.temp }}/factory-codex-home
        permission-profile: ":read-only"
        safety-strategy: drop-sudo

    - name: Keep review output (attempt 1)
      id: keep_1
      if: steps.preflight.outputs.eligible == 'true'
      shell: bash
      env:
        PROVIDER: ${{ steps.preflight.outputs.provider }}
        CLAUDE_FILE: ${{ steps.claude_1.outputs.execution_file }}
        CODEX_FILE: ${{ runner.temp }}/factory-codex-output-1.txt
        REVIEW_OUTPUT_FILE: ${{ runner.temp }}/factory-review-output
      run: bash "$GITHUB_ACTION_PATH/keep-output.sh"

    - name: Validate first review output
      id: validate_1
      if: steps.preflight.outputs.eligible == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        REPOSITORY: ${{ inputs.repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PROVIDER: ${{ steps.preflight.outputs.provider }}
        REVIEW_TICKET: ${{ steps.preflight.outputs.ticket }}
        REVIEW_OUTPUT_FILE: ${{ runner.temp }}/factory-review-output
      run: pnpm exec tsx src/review/action-runner.ts validate

    - name: Route after review attempt 1
      id: route_1
      if: steps.preflight.outputs.eligible == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        REPOSITORY: ${{ inputs.repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        VALID: ${{ steps.validate_1.outputs.valid }}
        FAILURE_KIND: ${{ steps.validate_1.outputs.failure_kind }}
        VALIDATION_REFILL_AT: ${{ steps.validate_1.outputs.refill_at }}
        PROVIDER: ${{ steps.preflight.outputs.provider }}
        MODEL: ${{ steps.preflight.outputs.model }}
        EFFORT: ${{ steps.preflight.outputs.effort }}
        PROVIDER_ATTEMPT: "1"
        FALLBACK_USED: "false"
        REFILL_AT: ""
      run: pnpm exec tsx src/review/action-runner.ts route

    - name: Review with Claude (attempt 2)
      id: claude_2
      if: steps.route_1.outputs.run_next == 'true' && steps.route_1.outputs.next_provider == 'claude'
      continue-on-error: true
      uses: anthropics/claude-code-action@e4a6faad497d33dbc7144135c75e41f82f0bf6c0 # v1.0.255
      env:
        CLAUDE_CONFIG_DIR: ${{ runner.temp }}/factory-claude-config
        CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
      with:
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        # Omitting this does not narrow access: the action falls back to github.token
        # (the same job token) or an OIDC app exchange this job cannot perform.
        github_token: ${{ inputs.github-token }}
        display_report: "false"
        include_fix_links: "false"
        show_full_output: "false"
        prompt: ${{ steps.preflight.outputs.prompt }}
        claude_args: >-
          --model ${{ steps.route_1.outputs.next_model }}
          --max-turns ${{ steps.preflight.outputs.max_turns }}
          --allowedTools "Read" "Glob" "Grep" "Skill" "Bash(git -C pr diff:*)" "Bash(git -C pr show:*)" "Bash(git -C pr log:*)"
          --disallowedTools "Edit" "Write" "NotebookEdit" "WebFetch" "WebSearch"
          --json-schema '${{ steps.preflight.outputs.output_schema }}'

    - name: Review with Codex (attempt 2)
      id: codex_2
      if: steps.route_1.outputs.run_next == 'true' && steps.route_1.outputs.next_provider == 'codex'
      continue-on-error: true
      uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
      with:
        openai-api-key: ${{ inputs.openai-api-key }}
        prompt: ${{ steps.preflight.outputs.prompt }}
        output-file: ${{ runner.temp }}/factory-codex-output-2.txt
        output-schema-file: ${{ steps.preflight.outputs.output_schema_path }}
        model: ${{ steps.route_1.outputs.next_model }}
        effort: ${{ steps.route_1.outputs.next_effort }}
        codex-home: ${{ runner.temp }}/factory-codex-home
        permission-profile: ":read-only"
        safety-strategy: drop-sudo

    - name: Keep review output (attempt 2)
      id: keep_2
      if: steps.route_1.outputs.run_next == 'true'
      shell: bash
      env:
        PROVIDER: ${{ steps.route_1.outputs.next_provider }}
        CLAUDE_FILE: ${{ steps.claude_2.outputs.execution_file }}
        CODEX_FILE: ${{ runner.temp }}/factory-codex-output-2.txt
        REVIEW_OUTPUT_FILE: ${{ runner.temp }}/factory-review-output
      run: bash "$GITHUB_ACTION_PATH/keep-output.sh"

    - name: Validate review output (attempt 2)
      id: validate_2
      if: steps.route_1.outputs.run_next == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        REPOSITORY: ${{ inputs.repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PROVIDER: ${{ steps.route_1.outputs.next_provider }}
        REVIEW_TICKET: ${{ steps.preflight.outputs.ticket }}
        REVIEW_OUTPUT_FILE: ${{ runner.temp }}/factory-review-output
      run: pnpm exec tsx src/review/action-runner.ts validate

    - name: Route after review attempt 2
      id: route_2
      if: steps.route_1.outputs.run_next == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        REPOSITORY: ${{ inputs.repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        VALID: ${{ steps.validate_2.outputs.valid }}
        FAILURE_KIND: ${{ steps.validate_2.outputs.failure_kind }}
        VALIDATION_REFILL_AT: ${{ steps.validate_2.outputs.refill_at }}
        PROVIDER: ${{ steps.route_1.outputs.next_provider }}
        MODEL: ${{ steps.route_1.outputs.next_model }}
        EFFORT: ${{ steps.route_1.outputs.next_effort }}
        PROVIDER_ATTEMPT: ${{ steps.route_1.outputs.next_provider_attempt }}
        FALLBACK_USED: ${{ steps.route_1.outputs.next_fallback_used }}
        REFILL_AT: ${{ steps.route_1.outputs.next_refill_at }}
      run: pnpm exec tsx src/review/action-runner.ts route

    - name: Review with Codex (attempt 3)
      id: codex_3
      if: steps.route_2.outputs.run_next == 'true' && steps.route_2.outputs.next_provider == 'codex'
      continue-on-error: true
      uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
      with:
        openai-api-key: ${{ inputs.openai-api-key }}
        prompt: ${{ steps.preflight.outputs.prompt }}
        output-file: ${{ runner.temp }}/factory-codex-output-3.txt
        output-schema-file: ${{ steps.preflight.outputs.output_schema_path }}
        model: ${{ steps.route_2.outputs.next_model }}
        effort: ${{ steps.route_2.outputs.next_effort }}
        codex-home: ${{ runner.temp }}/factory-codex-home
        permission-profile: ":read-only"
        safety-strategy: drop-sudo

    - name: Keep review output (attempt 3)
      id: keep_3
      if: steps.route_2.outputs.run_next == 'true'
      shell: bash
      env:
        PROVIDER: ${{ steps.route_2.outputs.next_provider }}
        CLAUDE_FILE: ""
        CODEX_FILE: ${{ runner.temp }}/factory-codex-output-3.txt
        REVIEW_OUTPUT_FILE: ${{ runner.temp }}/factory-review-output
      run: bash "$GITHUB_ACTION_PATH/keep-output.sh"

    - name: Validate review output (attempt 3)
      id: validate_3
      if: steps.route_2.outputs.run_next == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        REPOSITORY: ${{ inputs.repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PROVIDER: ${{ steps.route_2.outputs.next_provider }}
        REVIEW_TICKET: ${{ steps.preflight.outputs.ticket }}
        REVIEW_OUTPUT_FILE: ${{ runner.temp }}/factory-review-output
      run: pnpm exec tsx src/review/action-runner.ts validate

    - name: Route after review attempt 3
      id: route_3
      if: steps.route_2.outputs.run_next == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        REPOSITORY: ${{ inputs.repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        VALID: ${{ steps.validate_3.outputs.valid }}
        FAILURE_KIND: ${{ steps.validate_3.outputs.failure_kind }}
        VALIDATION_REFILL_AT: ${{ steps.validate_3.outputs.refill_at }}
        PROVIDER: ${{ steps.route_2.outputs.next_provider }}
        MODEL: ${{ steps.route_2.outputs.next_model }}
        EFFORT: ${{ steps.route_2.outputs.next_effort }}
        PROVIDER_ATTEMPT: ${{ steps.route_2.outputs.next_provider_attempt }}
        FALLBACK_USED: ${{ steps.route_2.outputs.next_fallback_used }}
        REFILL_AT: ${{ steps.route_2.outputs.next_refill_at }}
      run: pnpm exec tsx src/review/action-runner.ts route

    - name: Review with Codex (attempt 4)
      id: codex_4
      if: steps.route_3.outputs.run_next == 'true' && steps.route_3.outputs.next_provider == 'codex'
      continue-on-error: true
      uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
      with:
        openai-api-key: ${{ inputs.openai-api-key }}
        prompt: ${{ steps.preflight.outputs.prompt }}
        output-file: ${{ runner.temp }}/factory-codex-output-4.txt
        output-schema-file: ${{ steps.preflight.outputs.output_schema_path }}
        model: ${{ steps.route_3.outputs.next_model }}
        effort: ${{ steps.route_3.outputs.next_effort }}
        codex-home: ${{ runner.temp }}/factory-codex-home
        permission-profile: ":read-only"
        safety-strategy: drop-sudo

    - name: Keep review output (attempt 4)
      id: keep_4
      if: steps.route_3.outputs.run_next == 'true'
      shell: bash
      env:
        PROVIDER: ${{ steps.route_3.outputs.next_provider }}
        CLAUDE_FILE: ""
        CODEX_FILE: ${{ runner.temp }}/factory-codex-output-4.txt
        REVIEW_OUTPUT_FILE: ${{ runner.temp }}/factory-review-output
      run: bash "$GITHUB_ACTION_PATH/keep-output.sh"

    - name: Validate review output (attempt 4)
      id: validate_4
      if: steps.route_3.outputs.run_next == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        REPOSITORY: ${{ inputs.repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PROVIDER: ${{ steps.route_3.outputs.next_provider }}
        REVIEW_TICKET: ${{ steps.preflight.outputs.ticket }}
        REVIEW_OUTPUT_FILE: ${{ runner.temp }}/factory-review-output
      run: pnpm exec tsx src/review/action-runner.ts validate

    - name: Route after review attempt 4
      id: route_4
      if: steps.route_3.outputs.run_next == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        REPOSITORY: ${{ inputs.repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        VALID: ${{ steps.validate_4.outputs.valid }}
        FAILURE_KIND: ${{ steps.validate_4.outputs.failure_kind }}
        VALIDATION_REFILL_AT: ${{ steps.validate_4.outputs.refill_at }}
        PROVIDER: ${{ steps.route_3.outputs.next_provider }}
        MODEL: ${{ steps.route_3.outputs.next_model }}
        EFFORT: ${{ steps.route_3.outputs.next_effort }}
        PROVIDER_ATTEMPT: ${{ steps.route_3.outputs.next_provider_attempt }}
        FALLBACK_USED: ${{ steps.route_3.outputs.next_fallback_used }}
        REFILL_AT: ${{ steps.route_3.outputs.next_refill_at }}
      run: pnpm exec tsx src/review/action-runner.ts route

    - name: Publish the Factory PR Review check
      id: publish
      if: steps.preflight.outputs.eligible == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        REPOSITORY: ${{ inputs.repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REVIEW_TICKET: ${{ steps.preflight.outputs.ticket }}
        REVIEW_OUTPUT_FILE: ${{ runner.temp }}/factory-review-output
        ATTRIBUTION: ${{ steps.route_4.outputs.attribution || steps.route_3.outputs.attribution || steps.route_2.outputs.attribution || steps.route_1.outputs.attribution }}
      run: pnpm exec tsx src/review/action-runner.ts publish

    - name: Fail the pending check after an unfinished review
      id: fail
      if: always() && steps.preflight.outputs.eligible == 'true' && steps.publish.outcome != 'success'
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        REPOSITORY: ${{ inputs.repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REVIEW_TICKET: ${{ steps.preflight.outputs.ticket }}
        ATTRIBUTION: ${{ steps.route_4.outputs.attribution || steps.route_3.outputs.attribution || steps.route_2.outputs.attribution || steps.route_1.outputs.attribution }}
        FAILURE_REASON: review job failed or was cancelled before publication
      run: pnpm exec tsx src/review/action-runner.ts fail
