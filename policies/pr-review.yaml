version: 1

checkName: Factory PR Review

rubric:
  version: 3
  maxFindings: 50
  minimumConfidence: 0.9

sizeLimit:
  maxChangedLines: 3000
  maxChangedFiles: 50
  excludedPaths:
    - pnpm-lock.yaml
    - package-lock.json
    - yarn.lock
    - "**/migrations/meta/*_snapshot.json"

canary:
  minimumPullRequests: 10
  maxDays: 14
  maxFalsePositives: 1
  maxTechnicalErrorRate: 0.05
  maxP95LatencyMinutes: 10

repositories:
  - id: campus-web
    mode: advisory
    ciWorkflowName: CI
    targetBranches: [dev, main]
    standardsPaths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "/CONTRIBUTIONS.md"
      - "/GLOSSARY.md"
      - "**/README.md"
      - "/docs/"
    provider:
      id: claude
      model: claude-opus-5-5
    canaryStartsAt: "2026-11-26T06:40:00Z"
    canaryProvider:
      id: claude
      model: claude-opus-5-5
    credential:
      secret: CLAUDE_CODE_OAUTH_TOKEN
      ownership: personal
      owner: AJ1732
      expiresOn: "2027-10-25"
      rotateBy: "2027-09-25"
  - id: campus-server
    mode: advisory
    ciWorkflowName: CI
    targetBranches: [dev, main]
    standardsPaths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "/CONTRIBUTIONS.md"
      - "**/README.md"
      - "/docs/"
    provider:
      id: claude
      model: claude-opus-5-5
    canaryStartsAt: "2026-11-26T06:40:00Z"
    canaryProvider:
      id: claude
      model: claude-opus-5-5
    credential:
      secret: CLAUDE_CODE_OAUTH_TOKEN
      ownership: personal
      owner: AJ1732
      expiresOn: "2027-10-25"
      rotateBy: "2027-09-25"
  - id: campus-mobile
    mode: advisory
    ciWorkflowName: Mobile quality
    targetBranches: [dev, main]
    standardsPaths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "/CONTRIBUTIONS.md"
      - "/README.md"
      - "/src/**/README.md"
      - "/docs/"
    provider:
      id: claude
      model: claude-opus-5-5
    canaryStartsAt: "2026-11-26T22:31:00Z"
    canaryProvider:
      id: claude
      model: claude-opus-5-5
    credential:
      secret: CLAUDE_CODE_OAUTH_TOKEN
      ownership: personal
      owner: AJ1732
      expiresOn: "2027-10-25"
      rotateBy: "2027-09-25"
