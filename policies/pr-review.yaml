version: 1

checkName: Factory PR Review

rubric:
  version: 2
  maxFindings: 50
  minimumConfidence: 0.9

canary:
  minimumPullRequests: 10
  maxDays: 14
  maxFalsePositives: 1
  maxTechnicalErrorRate: 0.05
  maxP95LatencyMinutes: 10

repositories:
  - id: campus-web
    mode: advisory
    ciWorkflowName: CI
    targetBranches: [dev, main]
    provider:
      id: claude
      model: claude-opus-5-5
    canaryStartsAt: "2026-10-25T12:00:00Z"
    canaryProvider:
      id: claude
      model: claude-opus-5-5
    credential:
      secret: CLAUDE_CODE_OAUTH_TOKEN
      ownership: personal
      owner: AJ1732
      expiresOn: "2027-10-25"
      rotateBy: "2027-09-25"
  - id: campus-server
    mode: disabled
    ciWorkflowName: CI
    targetBranches: [dev, main]
    provider:
      id: claude
      model: claude-opus-5-5
  - id: campus-mobile
    mode: disabled
    ciWorkflowName: Mobile quality
    targetBranches: [dev, main]
    provider:
      id: claude
      model: claude-opus-5-5
